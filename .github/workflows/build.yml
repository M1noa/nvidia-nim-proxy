name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: test
        run: go test ./...

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev"
          OUT="nvidia-nim-proxy-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && OUT="$OUT.exe"
          go build -trimpath -ldflags "-s -w -X main.versionStr=$VERSION" -o "$OUT" .

      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-nim-proxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nvidia-nim-proxy-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nvidia-nim-proxy-*
          merge-multiple: true

      - name: checksums
        run: sha256sum nvidia-nim-proxy-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nvidia-nim-proxy-*
            checksums.txt
          generate_release_notes: true
